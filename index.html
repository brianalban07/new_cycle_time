<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Cycle Time Dashboard</title>

<script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body {
  margin:0;
  font-family:Segoe UI;
  display:flex;
}

/* ✅ SIDEBAR */
.sidebar {
  width:220px;
  background:#1e293b;
  color:#fff;
  height:100vh;
  padding:20px;
}

.sidebar h2 {
  font-size:18px;
}

/* ✅ MAIN */
.main {
  flex:1;
  background:#f4f6f9;
  padding:20px;
}

/* ✅ CARD */
.card {
  background:#fff;
  padding:20px;
  border-radius:10px;
  margin-bottom:20px;
}

/* DARK MODE */
.dark body { background:#111; }
.dark .main { background:#111; }
.dark .card { background:#1f2937; color:#fff; }
.dark table { color:#fff; }

/* BUTTON */
button {
  padding:8px 15px;
  background:#0078d4;
  color:white;
  border:none;
  border-radius:5px;
  margin-top:10px;
}

/* PROGRESS BAR */
.progress {
  width:100%;
  background:#ccc;
  height:10px;
  border-radius:5px;
  margin-top:10px;
}

.progress-bar {
  width:0%;
  height:100%;
  background:#28a745;
  border-radius:5px;
}

/* TABLE */
table { width:100%; border-collapse:collapse; }
th,td { border:1px solid #ddd; padding:6px; text-align:center; }
th { background:#333; color:white; }

.week { background:#ffd966; }
.total { background:#28a745; color:white; }
</style>
</head>

<body>

<!-- ✅ SIDEBAR -->
<div class="sidebar">
  <h2>Dashboard</h2>

  <button onclick="toggleDark()">🌙 Dark Mode</button>
  <button onclick="exportExcel()">⬇ Export Excel</button>
</div>

<!-- ✅ MAIN -->
<div class="main">

<div class="card">
<h2>Cycle Time Analyzer</h2>

<select id="modeSelect">
  <option value="">Select Mode</option>
  <option value="single">Single</option>
  <option value="multiple">Multiple</option>
</select>

<input type="number" id="weekCount" placeholder="Weeks">

<div id="fileContainer"></div>

<button id="calculateBtn">Calculate</button>

<div class="progress">
  <div id="progressBar" class="progress-bar"></div>
</div>

</div>

<div class="card">
<h3>Chart</h3>
<canvas id="chart"></canvas>
</div>

<div class="card">
<table>
<thead><tr id="headerRow"></tr></thead>
<tbody id="bodyRow"></tbody>
</table>
</div>

</div>

<script>
const stageOrder = ["INIT","AST","FLA","IOT","FCT","FC2","IST","FPF","NVL"];

let uploadedFiles = [];
let worker = new Worker('./fileWorker.js');
let isSingle = false;

// ✅ DARK MODE
function toggleDark(){
  document.body.classList.toggle("dark");
}

// ✅ INPUTS
modeSelect.onchange = function(){
  fileContainer.innerHTML='';
  uploadedFiles=[];

  if(this.value==="single"){
    isSingle=true;
    createInputs(1);
  } else {
    isSingle=false;
  }
};

weekCount.onchange = function(){
  createInputs(parseInt(this.value));
};

function createInputs(count){
  fileContainer.innerHTML='';
  uploadedFiles=new Array(count).fill(null);

  for(let i=0;i<count;i++){
    let div=document.createElement('div');
    div.innerHTML=`Week ${i+1}: <input type="file">`;

    div.querySelector('input').onchange=e=>{
      uploadedFiles[i]=e.target.files[0];
    };

    fileContainer.appendChild(div);
  }
}

// ✅ HEADER
function createHeader(){
  headerRow.innerHTML='';
  if(!isSingle) headerRow.innerHTML+='<th>Week</th>';
  stageOrder.forEach(s=>headerRow.innerHTML+=`<th>${s}</th>`);
  headerRow.innerHTML+='<th>TOTAL</th>';
}

// ✅ FORMAT
function format(sec){
  let h=Math.floor(sec/3600);
  let m=Math.floor((sec%3600)/60);
  let s=Math.floor(sec%60);
  return `${h.toString().padStart(2,'0')}:${m.toString().padStart(2,'0')}:${s.toString().padStart(2,'0')}`;
}

// ✅ PROCESS
calculateBtn.onclick = async function(){

  let buffers=[];
  let progress=0;

  for(let i=0;i<uploadedFiles.length;i++){
    buffers.push(await uploadedFiles[i].arrayBuffer());

    progress = ((i+1)/uploadedFiles.length)*100;
    progressBar.style.width = progress + "%";
  }

  worker.postMessage({buffers});
};

// ✅ RECEIVE
worker.onmessage=function(e){

  const {results}=e.data;

  bodyRow.innerHTML='';
  createHeader();

  let chartData = [];

  results.forEach((r,i)=>{
    let total=0;
    let row="<tr>";

    if(!isSingle) row+=`<td class="week">${i+1}</td>`;

    stageOrder.forEach(s=>{
      let avg=r.dur[s]?r.dur[s]/r.cnt[s]:0;
      total+=avg;
      row+=`<td>${format(avg)}</td>`;
      chartData.push(avg);
    });

    row+=`<td class="total">${format(total)}</td></tr>`;
    bodyRow.innerHTML+=row;
  });

  drawChart(chartData);
};

// ✅ CHART
function drawChart(data){
  new Chart(document.getElementById('chart'), {
    type:'bar',
    data:{
      labels: stageOrder,
      datasets:[{
        label:'Avg Time',
        data:data.slice(0,stageOrder.length),
        backgroundColor:'#0078d4'
      }]
    }
  });
}

// ✅ EXPORT
function exportExcel(){
  let wb = XLSX.utils.table_to_book(document.querySelector("table"));
  XLSX.writeFile(wb, "CycleTime.xlsx");
}
</script>

</body>
</html>
