<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cycle Time Dashboard</title>

<script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
.hidden{display:none;}
</style>
</head>

<body>

<select id="modeSelect">
  <option value="">Select Mode</option>
  <option value="single">Single</option>
  <option value="multiple">Multiple</option>
</select>

<input type="number" id="weekCount" class="hidden" placeholder="No. of Weeks">

<div id="fileContainer"></div>
<button id="calculateBtn">Calculate</button>

<div id="chartCard" class="hidden">
  <h3>Stage Trend</h3>
  <canvas id="chart"></canvas>
</div>

<table>
<thead><tr id="headerRow"></tr></thead>
<tbody id="bodyRow"></tbody>
</table>

<div id="loadingOverlay" class="hidden">Processing...</div>

<script>

const stageOrder=["INIT","AST","FLA","IOT","FCT","FC2","IST","FPF","NVL"];

let uploadedFiles=[];
let worker=new Worker('./fileWorker.js');
let isSingle=false;

// ✅ FORCE HIDE ON LOAD
window.onload = function(){
  weekCount.classList.add("hidden");
  chartCard.classList.add("hidden");
};

// ✅ MODE
modeSelect.onchange=function(){

  fileContainer.innerHTML='';
  uploadedFiles=[];

  if(this.value==="single"){
    isSingle=true;
    weekCount.classList.add("hidden");
    createInputs(1,true);
  }
  else if(this.value==="multiple"){
    isSingle=false;
    weekCount.classList.remove("hidden");
  }
};

// CREATE INPUTS
weekCount.onchange=function(){
  createInputs(parseInt(this.value),false);
};

function createInputs(count,isSingleMode=false){
  fileContainer.innerHTML='';
  uploadedFiles=new Array(count).fill(null);

  for(let i=0;i<count;i++){
    let div=document.createElement('div');

    if(isSingleMode){
      div.innerHTML=`<input type="file">`;
    }else{
      div.innerHTML=`Week ${i+1}: <input type="file">`;
    }

    div.querySelector('input').onchange=e=>{
      uploadedFiles[i]=e.target.files[0];
    };

    fileContainer.appendChild(div);
  }
}

// HEADER
function createHeader(){
  headerRow.innerHTML='';
  if(!isSingle) headerRow.innerHTML+='<th>Week</th>';
  stageOrder.forEach(s=>headerRow.innerHTML+=`<th>${s}</th>`);
  headerRow.innerHTML+='<th>TOTAL</th>';
}

// FORMAT
function format(sec){
  let h=Math.floor(sec/3600);
  let m=Math.floor((sec%3600)/60);
  let s=Math.floor(sec%60);
  return `${h.toString().padStart(2,'0')}:${m.toString().padStart(2,'0')}:${s.toString().padStart(2,'0')}`;
}

// CALCULATE
calculateBtn.onclick=async function(){

  if(uploadedFiles.length===0)return;

  loadingOverlay.classList.remove("hidden");

  let buffers=[];

  for(let f of uploadedFiles){
    buffers.push(await f.arrayBuffer());
  }

  worker.postMessage({buffers});
};

// RECEIVE
worker.onmessage=function(e){

  loadingOverlay.classList.add("hidden");

  const {results}=e.data;

  bodyRow.innerHTML='';
  createHeader();

  let all=[];
  let chartData=[];

  results.forEach((r,i)=>{

    let total=0;
    let row="<tr>";

    if(!isSingle){
      row+=`<td>${i+1}</td>`;
    }

    let weekAvg={};

    stageOrder.forEach(s=>{

      // ✅ FIXED ERROR HERE
      let avg = r.dur[s] ? r.dur[s] / r.cnt[s] : 0;

      if(avg>0){
        total+=avg;
        row+=`<td>${format(avg)}</td>`;
      }else{
        row+="<td>N/A</td>";
      }

      weekAvg[s]=avg;
      chartData.push(avg);
    });

    row+=`<td>${format(total)}</td></tr>`;
    bodyRow.innerHTML+=row;

    all.push(weekAvg);
  });

  chartCard.classList.remove("hidden");

  if(!isSingle && results.length>1){
    addAverageRow(all);
  }

  drawChart(chartData);
};

// AVERAGE ROW
function addAverageRow(all){

  let row="<tr><td>All Files</td>";
  let total=0;

  stageOrder.forEach(stage=>{

    let sum=0,count=0;

    all.forEach(w=>{
      if(w[stage]>0){
        sum+=w[stage];
        count++;
      }
    });

    let avg=count?sum/count:0;

    if(avg>0){
      total+=avg;
      row+=`<td>${format(avg)}</td>`;
    }else{
      row+="<td>N/A</td>";
    }
  });

  row+=`<td>${format(total)}</td></tr>`;
  bodyRow.innerHTML+=row;
}

// CHART
function drawChart(data){

  new Chart(document.getElementById('chart'),{
    type:'bar',
    data:{
      labels:stageOrder,
      datasets:[{
        label:'Average Time',
        data:data.slice(0,stageOrder.length)
      }]
    }
  });
}

</script>

</body>
</html>
